<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="GESELL: guía turística de Villa Gesell con mapa interactivo.">
  <title>GESELL · Villa Gesell</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌊%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="fonts/GOTHAM-BLACK.OTF" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="images/gesell-360.jpg" as="fetch" crossorigin fetchpriority="high">
  <script src="js/return-intro.js"></script>
  <script src="js/orientation-compat.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css?v=maps-7">
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" defer></script>
</head>
<body>
  <main>
    <section class="hero" aria-label="Panorama interactivo de Villa Gesell">
      <div class="panorama-stage" id="panorama"></div>
      <div class="hero-brand" id="heroBrand">
        <h1 class="title" id="page-title">Gesell</h1>
        <p class="subtitle" id="subtitle" aria-live="off">es querer volver</p>
      </div>

      <button class="orientation-toggle" id="orientationToggle" type="button" aria-pressed="false">
        Activar movimiento
      </button>

      <button class="map-toggle" id="mapToggle" type="button" aria-controls="map" aria-expanded="false">
        MAPA
      </button>

      <a class="assistant-toggle" href="/asistente/" aria-label="Abrir GesellGO">ASISTENTE</a>
    </section>

    <section class="map" id="map" aria-label="Mapas turísticos de Villa Gesell" role="dialog" aria-modal="true" aria-hidden="true" inert>
      <div class="map-canvas" id="mapCanvas" aria-label="Mapa interactivo de Villa Gesell" aria-hidden="true"></div>

      <div class="map-status" id="mapStatus" role="status" aria-live="polite" hidden>
        <span id="mapStatusText"></span>
        <button id="mapRetry" type="button" hidden>Reintentar</button>
      </div>

      <div class="map-picker" id="mapPicker" aria-labelledby="mapPickerTitle">
        <div class="map-picker-inner">
          <h2 id="mapPickerTitle">¿A dónde vamos?</h2>

          <div class="map-options" role="group" aria-label="Elegir un mapa">
            <button class="map-option" type="button" data-map-id="gastronomia" aria-pressed="false">
              <span class="map-option-symbol" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M7 3v6M4.5 3v4.5a2.5 2.5 0 0 0 5 0V3M7 9.5V21M16 3v18M16 3c-2.4 2.2-3 5-3 8h3"/>
                </svg>
              </span>
              <span class="map-option-copy">
                <span class="map-option-title">Gastronomía</span>
                </span>
            </button>

            <button class="map-option" type="button" data-map-id="locales" aria-pressed="false">
              <span class="map-option-symbol" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 10.5V20h16v-9.5"/>
                  <path d="M3 10.5 4.6 4h14.8l1.6 6.5"/>
                  <path d="M3 10.5a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 3 0"/>
                  <path d="M9 20v-5h6v5"/>
                </svg>
              </span>
              <span class="map-option-copy">
                <span class="map-option-title">Locales y servicios</span>
                </span>
            </button>

            <button class="map-option" type="button" data-map-id="puntos_interes" aria-pressed="false">
              <span class="map-option-symbol" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 10h18L12 4 3 10Z"/>
                  <path d="M5 20h14M7 10v7m5-7v7m5-7v7M4 21h16"/>
                </svg>
              </span>
              <span class="map-option-copy">
                <span class="map-option-title">Puntos de interés</span>
                </span>
            </button>

            <button class="map-option" type="button" data-map-id="balnearios" aria-pressed="false">
              <span class="map-option-symbol" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 12a9 9 0 0 1 18 0H3Z"/>
                  <path d="M12 3v13m0 0a2 2 0 1 0 4 2"/>
                  <path d="M4 19c1.4-1 2.8-1 4.2 0s2.8 1 4.2 0 2.8-1 4.2 0 2.8 1 4.2 0"/>
                </svg>
              </span>
              <span class="map-option-copy">
                <span class="map-option-title">Balnearios</span>
                </span>
            </button>
          </div>
        </div>
      </div>

      <nav class="map-dock" id="mapDock" aria-label="Cambiar de mapa" aria-hidden="true" inert style="--active-index:0">
        <span class="map-dock-indicator" aria-hidden="true"></span>
        <button class="map-dock-button" type="button" data-map-id="gastronomia" aria-label="Cambiar al mapa de Gastronomía" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 3v6M4.5 3v4.5a2.5 2.5 0 0 0 5 0V3M7 9.5V21M16 3v18M16 3c-2.4 2.2-3 5-3 8h3"/>
          </svg>
        </button>
        <button class="map-dock-button" type="button" data-map-id="locales" aria-label="Cambiar al mapa de Locales y servicios" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 10.5V20h16v-9.5"/><path d="M3 10.5 4.6 4h14.8l1.6 6.5"/><path d="M3 10.5a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 3 0"/><path d="M9 20v-5h6v5"/>
          </svg>
        </button>
        <button class="map-dock-button" type="button" data-map-id="puntos_interes" aria-label="Cambiar al mapa de Puntos de interés" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10h18L12 4 3 10Z"/><path d="M5 20h14M7 10v7m5-7v7m5-7v7M4 21h16"/>
          </svg>
        </button>
        <button class="map-dock-button" type="button" data-map-id="balnearios" aria-label="Cambiar al mapa de Balnearios" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 18 0H3Z"/><path d="M12 3v13m0 0a2 2 0 1 0 4 2"/><path d="M4 19c1.4-1 2.8-1 4.2 0s2.8 1 4.2 0 2.8-1 4.2 0 2.8 1 4.2 0"/>
          </svg>
        </button>
      </nav>

      <button class="panorama-toggle" id="panoramaToggle" type="button" aria-label="Volver al panorama 360°" title="Volver al panorama 360°">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <ellipse cx="12" cy="12" rx="4" ry="9"></ellipse>
          <path d="M3.8 8.5h16.4M3.8 15.5h16.4M5.7 5.7c3.7 2.5 9 2.5 12.6 0M5.7 18.3c3.7-2.5 9-2.5 12.6 0"></path>
        </svg>
      </button>
    </section>
  </main>

  <noscript><p class="noscript">Activá JavaScript para ver la foto 360° y el mapa interactivo.</p></noscript>
  <script src="js/app.js?v=maps-2" defer></script>
  <script src="js/maps.js?v=maps-8" defer></script>
</body>
</html>
